name: Feature request
description: Suggest a gesture, action or haptic idea
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to do with your trackpad?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
      description: Which apps or workflows would it help?
